name: formz_gen
description: Code generator for formz. Annotate one abstract class and get the FormzInput subclasses, error enums, FormzMixin state, cross-field checks and optional field-changed events.
version: 0.1.0
repository: https://github.com/GeneralBlaze/formz_gen
issue_tracker: https://github.com/GeneralBlaze/formz_gen/issues

environment:
  sdk: ^3.12.0
resolution: workspace

dependencies:
  analyzer: ^14.0.0
  build: ^4.0.0
  formz_gen_annotation: ^0.1.0
  source_gen: ^4.0.0

dev_dependencies:
  build_test: ^3.5.0
  formz: ^0.8.1
  test: ^1.25.0
  very_good_analysis: ^10.3.0
